<!DOCTYPE html>
<html>
<head>
    <title>Campus Student</title>

    <!-- Your favicon -->
    <link rel="icon" type="image/png" href="classroom.png">

    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 60px;
            margin: 0;
        }

        /* Banner at top */
        #banner {
            width: 100%;
            height: 200px;
            object-fit: cover;
            margin-bottom: 20px;
        }

        #arrow {
            font-size: 40px;
            display: none;
            margin-top: 20px;
        }
        #warning {
            display: none;
            margin-top: 10px;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        img.logo {
            width: 120px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Your banner -->
    <img id="banner" src="page.png" alt="Banner">

    <!-- Your Classroom logo -->
    <img class="logo" src="classroom.png" alt="Google Classroom">

    <h1>Launching…</h1>
    <button id="launchBtn" onclick="launch()" style="display:none;">Launch</button>

    <div id="warning">Popup blocked — check the top right of your browser.</div>
    <div id="arrow">⬆️</div>

    <script>
        const url = "https://takaiwebsite.neocities.org/minecraft";

        function launch() {
            const win = window.open("about:blank", "_blank");

            if (win) {
                win.document.title = "Launcher";
                win.document.body.style.margin = "0";
                win.document.body.style.height = "100vh";

                const iframe = win.document.createElement("iframe");
                iframe.src = url;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";

                win.document.body.appendChild(iframe);
            } else {
                document.getElementById("warning").style.display = "block";
                document.getElementById("arrow").style.display = "block";
                document.getElementById("launchBtn").style.display = "inline-block";
            }
        }

        // Try to auto-launch immediately
        window.onload = () => {
            launch();
        };
    </script>

</body>
</html>
