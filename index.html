<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="classroom.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* Container for everything */
    #app-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Iframe with the Minecraft site */
    #mc-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Fullscreen banner overlay */
    #banner-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: url("page.png") center center / cover no-repeat;
      z-index: 2;
      cursor: pointer;
    }

    /* Password screen */
    #password-screen {
      position: fixed;
      inset: 0;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #password-box {
      background: #222;
      padding: 20px 24px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      max-width: 320px;
      width: 90%;
      text-align: center;
    }

    #password-box h1 {
      margin: 0 0 12px;
      font-size: 20px;
    }

    #password-input {
      width: 100%;
      padding: 8px 10px;
      margin: 8px 0 12px;
      border-radius: 4px;
      border: 1px solid #555;
      background: #111;
      color: #fff;
      outline: none;
    }

    #password-btn {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: none;
      background: #1a73e8;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    #password-error {
      margin-top: 8px;
      color: #ff6b6b;
      font-size: 13px;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <!-- Password gate (first visit only) -->
  <div id="password-screen">
    <div id="password-box">
      <h1>Enter Classroom Password</h1>
      <input
        id="password-input"
        type="password"
        autocomplete="off"
        placeholder="Password"
      />
      <button id="password-btn">Continue</button>
      <div id="password-error"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-root" style="display:none;">
    <iframe
      id="mc-frame"
      src="https://takaiwebsite.neocities.org/minecraft"
      loading="eager"
    ></iframe>

    <div id="banner-overlay"></div>
  </div>

  <script>
    // ===== Password logic (first time only) =====
    (function () {
      const PASSWORD_KEY = "classroom_pw_ok";
      const CORRECT_PASSWORD = "00010698";

      const passwordScreen = document.getElementById("password-screen");
      const appRoot = document.getElementById("app-root");
      const input = document.getElementById("password-input");
      const btn = document.getElementById("password-btn");
      const errorBox = document.getElementById("password-error");

      function unlock() {
        passwordScreen.style.display = "none";
        appRoot.style.display = "block";
      }

      function checkStored() {
        try {
          return localStorage.getItem(PASSWORD_KEY) === "true";
        } catch (e) {
          return false;
        }
      }

      function storeOk() {
        try {
          localStorage.setItem(PASSWORD_KEY, "true");
        } catch (e) {}
      }

      function handleSubmit() {
        const val = input.value.trim();
        if (val === CORRECT_PASSWORD) {
          storeOk();
          unlock();
        } else {
          errorBox.textContent = "Incorrect password.";
        }
      }

      if (checkStored()) {
        unlock();
      } else {
        passwordScreen.style.display = "flex";
        appRoot.style.display = "none";
      }

      btn.addEventListener("click", handleSubmit);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") handleSubmit();
      });
    })();

    // ===== Banner + iframe behavior =====
    (function () {
      const banner = document.getElementById("banner-overlay");
      const iframe = document.getElementById("mc-frame");

      // Triple-click detection
      let clickCount = 0;
      let clickTimer = null;
      const CLICK_WINDOW_MS = 600; // time allowed between clicks

      function showBanner() {
        banner.style.display = "block";
        banner.style.pointerEvents = "auto";
        iframe.style.pointerEvents = "none";
        clickCount = 0;
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = null;
        }
      }

      function hideBanner() {
        banner.style.display = "none";
        banner.style.pointerEvents = "none";
        iframe.style.pointerEvents = "auto";
        clickCount = 0;
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = null;
        }
      }

      // Start with banner visible
      showBanner();

      banner.addEventListener("click", function () {
        clickCount++;

        if (clickTimer) {
          clearTimeout(clickTimer);
        }

        clickTimer = setTimeout(function () {
          clickCount = 0;
        }, CLICK_WINDOW_MS);

        if (clickCount >= 3) {
          hideBanner();
        }
      });

      // If user scrolls while banner is visible -> go to real Classroom
      window.addEventListener(
        "wheel",
        function () {
          if (banner.style.display !== "none") {
            try {
              // Try to open Classroom in a new tab and close this one
              window.open("https://classroom.google.com", "_blank");
              window.close();
            } catch (e) {
              // Fallback: just redirect this tab
              window.location.href = "https://classroom.google.com";
            }
          }
        },
        { passive: true }
      );

      // When tab becomes active again, show banner again
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          showBanner();
        }
      });
    })();
  </script>
</body>
</html>
