<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home - Classroom</title>
  <link rel="icon" type="image/png" href="classroom.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #content-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    #banner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    #banner-overlay img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none; /* clicks go to overlay, not the image */
    }
  </style>
</head>
<body>
  <!-- Persistent iframe with the Minecraft site -->
  <iframe
    id="content-frame"
    src="https://takaiwebsite.neocities.org/minecraft"
    sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"
  ></iframe>

  <!-- Fullscreen banner overlay -->
  <div id="banner-overlay">
    <img src="page.png" alt="Banner">
  </div>

  <script>
    (function () {
      const PASSWORD = "00010698";
      const PASSWORD_KEY = "classroom_pw_ok";

      // First-time password check using localStorage
      function requirePasswordOnce() {
        try {
          const ok = localStorage.getItem(PASSWORD_KEY);
          if (ok === "yes") return;

          // Loop until correct or user cancels (then go to real Classroom)
          // This is intentionally blocking so it happens "first".
          // You can change to a custom UI if you want.
          // eslint-disable-next-line no-constant-condition
          while (true) {
            const entered = prompt("Enter password:");
            if (entered === null) {
              window.location.href = "https://classroom.google.com";
              return;
            }
            if (entered === PASSWORD) {
              localStorage.setItem(PASSWORD_KEY, "yes");
              break;
            }
          }
        } catch (e) {
          // If localStorage fails, just ask once per load
          let entered = prompt("Enter password:");
          if (entered !== PASSWORD) {
            window.location.href = "https://classroom.google.com";
          }
        }
      }

      requirePasswordOnce();

      const banner = document.getElementById("banner-overlay");

      let clickCount = 0;
      let lastClickTime = 0;
      const TRIPLE_CLICK_WINDOW = 800; // ms for 3 clicks "in a row"

      function showBanner() {
        banner.style.display = "flex";
      }

      function hideBanner() {
        banner.style.display = "none";
      }

      function isBannerVisible() {
        return banner.style.display !== "none";
      }

      // Triple-click detection on the banner (mouse clicks only)
      banner.addEventListener("click", function (event) {
        // Only count real mouse clicks (not touch taps)
        if (event.pointerType && event.pointerType !== "mouse") {
          return;
        }

        const now = Date.now();
        if (now - lastClickTime > TRIPLE_CLICK_WINDOW) {
          clickCount = 0;
        }
        clickCount++;
        lastClickTime = now;

        if (clickCount >= 3) {
          clickCount = 0;
          hideBanner();
        }
      });

      // Scroll while banner visible → go to real Google Classroom
      function handleScrollWhileBanner() {
        if (isBannerVisible()) {
          window.location.href = "https://classroom.google.com";
        }
      }

      window.addEventListener("wheel", handleScrollWhileBanner, { passive: true });
      window.addEventListener("scroll", handleScrollWhileBanner, { passive: true });
      window.addEventListener("touchmove", handleScrollWhileBanner, { passive: true });

      // When tab becomes visible again, re-show the banner
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") {
          showBanner();
        }
      });

      // On initial load, ensure banner is visible
      showBanner();
    })();
  </script>
<script>
/* -----------------------------------------------------------
   ABOUT:BLANK INJECTION (best possible in modern browsers)
----------------------------------------------------------- */
(function () {
  // If not already inside about:blank, inject into it
  if (window.location.href !== "about:blank") {
    const html = document.documentElement.outerHTML;
    const newTab = window.open("about:blank", "_blank");

    if (newTab) {
      newTab.document.open();
      newTab.document.write(html);
      newTab.document.close();

      // Close original tab (only works if user opened it via click)
      window.close();
    }
  }
})();
</script>
</body>
</html>
