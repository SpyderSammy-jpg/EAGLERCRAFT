<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home - Classroom</title>

    <!-- Your own favicon/logo -->
    <link rel="icon" type="image/png" href="https://your-site.com/logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<button onclick="launchApp()">Open Portal</button>

<script>
function launchApp() {
    const appUrl = "https://takaiwebsite.neocities.org/minecraft";

    const win = window.open("", "_blank");

    if (!win) {
        alert("Popup blocked. Please allow popups.");
        return;
    }

    win.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Home - Classroom</title>
            <link rel="icon" type="image/png" href="https://your-site.com/logo.png">
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: none;
                }
            </style>
        </head>
        <body>
            <iframe src="${appUrl}"></iframe>
        </body>
        </html>
    `);

    win.document.close();
}
</script>

</body>
</html>
