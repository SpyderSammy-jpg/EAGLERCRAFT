<!DOCTYPE html>
<html>
<head>
    <title>Launcher</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 60px;
        }
        #arrow {
            font-size: 40px;
            display: none;
            margin-top: 20px;
        }
        #warning {
            display: none;
            margin-top: 10px;
        }
        button {
            padding: 12px 28px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        img {
            width: 120px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Google Classroom logo (allowed as decoration) -->
    <img src="https://ssl.gstatic.com/classroom/ic_product_classroom_96.png" alt="Google Classroom">

    <h1>Launch Website</h1>
    <button onclick="launch()">Launch</button>

    <div id="warning">Popup blocked — check the top right of your browser.</div>
    <div id="arrow">⬆️</div>

    <script>
        function launch() {
            const url = "https://takaiwebsite.neocities.org/minecraft";
            const win = window.open("about:blank", "_blank");

            if (win) {
                // Write iframe into the new tab
                win.document.title = "Launcher";
                win.document.body.style.margin = "0";
                win.document.body.style.height = "100vh";

                const iframe = win.document.createElement("iframe");
                iframe.src = url;
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";

                win.document.body.appendChild(iframe);
            } else {
                // Popup blocked
                document.getElementById("warning").style.display = "block";
                document.getElementById("arrow").style.display = "block";
            }
        }
    </script>

</body>
</html>
